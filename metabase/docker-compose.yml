services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - ./metabase-data:/metabase-data
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    networks:
      - astro_network
    restart: unless-stopped

networks:
  astro_network:
    external: true
    name: ${ASTRO_NETWORK_NAME}