version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: dbt-postgres-jaffle_shop
    environment:
      POSTGRES_USER: dbtuser
      POSTGRES_PASSWORD: dbtpass
      POSTGRES_DB: dbtdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres2:
    image: postgres:16
    container_name: dbt-postgres-eia
    environment:
      POSTGRES_USER: dbtuser2
      POSTGRES_PASSWORD: dbtpass2
      POSTGRES_DB: dbtdb2
    ports:
      - "5433:5432"
    volumes:
      - pgdata2:/var/lib/postgresql/data

volumes:
  pgdata:
  pgdata2: